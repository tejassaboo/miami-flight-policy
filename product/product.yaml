_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "One flight request, a university's real travel policy: book it, refuse it, or hold it for sign-off"
summary: "An agent handles one traveller's flight request under the University of Miami Travel Policy (PolicyStat 9607266, effective April 2021), read verbatim. It reads the trip record, searches a simulated flight world (real airports and airlines, synthetic schedules and fares) and submits a decision with the offer, cabin, reason, approver and policy section. A deterministic verifier rebuilds the offers and the policy's answer itself and checks every field. Twenty-four cases cover the departure-time window, the fare tolerance and the connection test to the dollar and the minute, better cabins on both sides of each time limit, federal grants, companions, personal days, the approvals every trip needs, and the policy's own unclear words."
highlights:
  - "The verbatim policy: no paraphrase, no rules restated in the task"
  - "Exact boundaries: 240 against 239 and 480 against 479 scheduled minutes, $201 against $199 saved"
  - "Unclear clauses become holds for approval, each once, with clear twins on both sides"
  - "Fully offline: a hash-seeded flight world with unguessable offer ids"
steps:
  - "Name a case, for example heron-gable, with the traveller's request"
  - "The agent reads the trip record and searches flights on the trip's route and date"
  - "It submits BOOK, REFUSE or FLAG_FOR_APPROVAL with the offer, cabin, reason, approver and section"
  - "The verifier recomputes the policy's answer and checks every field"
